<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Word Slicer</title>
  <meta name="description" content="Slice words into syllables with a knife and paint the vowels and consonants. A reading game for kids.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AA%3C/text%3E%3C/svg%3E">
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/","cannon-es":"./vendor/cannon-es.js"}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="viewport">
    <canvas id="stage" role="img" aria-label="A word made of wooden letter blocks on a cutting board. Drag the knife across it to slice it into syllables."></canvas>
    <div id="vignette"></div>
    <canvas id="overlay" aria-hidden="true"></canvas>
  </div>

  <header id="topbar">
    <h1>Word Slicer</h1>
    <p id="hint" aria-live="polite"></p>
    <div class="spacer"></div>
    <label>Level
      <select id="level">
        <option value="easy">Easy · 2 syllables</option>
        <option value="medium">Medium · 3 syllables</option>
        <option value="hard">Hard · 4+ syllables</option>
        <option value="mixed">Mixed</option>
        <option value="custom">My words</option>
      </select>
    </label>
    <button id="words-btn" class="icon-btn" title="My words: type your own word list" aria-label="Edit my words">✎</button>
    <label>Tasks
      <select id="tasks">
        <option value="both">Slice + paint</option>
        <option value="slice">Slice only</option>
        <option value="paint">Paint only</option>
      </select>
    </label>
    <label>Theme <select id="theme"></select></label>
    <div class="score" title="Words completed">⭐ <span id="score">0</span></div>
    <button id="mute" class="icon-btn" aria-pressed="false" aria-label="Sound on">🔊</button>
  </header>

  <dialog id="words-dialog" aria-labelledby="words-title">
    <h2 id="words-title">My words</h2>
    <p>One word per line. Put <b>-</b> between syllables (<code>but-ter</code>), <b>+</b> between the two words of a
      compound (<code>rain+bow</code>), and <b>|</b> before another accepted split (<code>ro-bot|rob-ot</code>).</p>
    <textarea id="words-text" rows="8" spellcheck="false" autocapitalize="off" placeholder="rab-bit&#10;rain+bow&#10;el-e-phant"></textarea>
    <ul id="words-errors" aria-live="polite"></ul>
    <div class="row">
      <button id="words-share" class="btn">Copy share link</button>
      <span class="spacer"></span>
      <button id="words-cancel" class="btn">Cancel</button>
      <button id="words-save" class="btn primary">Use these words</button>
    </div>
  </dialog>

  <section id="result" hidden aria-live="assertive">
    <h2 id="result-title"></h2>
    <div id="result-body"></div>
    <div class="row">
      <button id="result-keep" class="btn">Keep trying</button>
      <button id="result-next" class="btn primary">Next word ➜</button>
    </div>
  </section>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <nav id="toolbar" aria-label="Tools">
    <div class="group">
      <button class="tool" data-tool="knife" aria-pressed="true" title="Knife (1)">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 40 30 8c5 0 9 3 10 8L12 42z" fill="#cfd8e3" stroke="#56606d" stroke-width="2" stroke-linejoin="round"/><path d="M10 38l-4 4" stroke="#6b4a2f" stroke-width="5" stroke-linecap="round"/></svg>
        <span>Knife</span>
      </button>
      <button class="tool" data-tool="hand" aria-pressed="false" title="Hand (2): move letters; pieces stick like magnets">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 26V12a3 3 0 0 1 6 0v10m0-3V8a3 3 0 0 1 6 0v11m0-2v-6a3 3 0 0 1 6 0v18c0 8-5 13-12 13-6 0-9-3-12-8l-5-9a3 3 0 0 1 5-3l3 4" fill="#ffd9b8" stroke="#b07a52" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <span>Hand</span>
      </button>
      <button class="tool vowel" data-tool="vowel" aria-pressed="false" title="Vowel brush (3)">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M38 6 20 24" stroke="#8a5a2b" stroke-width="6" stroke-linecap="round"/><path d="M20 24c-5-1-9 3-8 8-3 3-5 4-6 8 7 1 13-1 16-6 4-1 6-5 4-8z" fill="var(--vowel)" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/></svg>
        <span>Vowels</span>
      </button>
      <button class="tool cons" data-tool="consonant" aria-pressed="false" title="Consonant brush (4)">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M38 6 20 24" stroke="#8a5a2b" stroke-width="6" stroke-linecap="round"/><path d="M20 24c-5-1-9 3-8 8-3 3-5 4-6 8 7 1 13-1 16-6 4-1 6-5 4-8z" fill="var(--cons)" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/></svg>
        <span>Consonants</span>
      </button>
      <button class="tool" data-tool="eraser" aria-pressed="false" title="Eraser (5)">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 30 26 10l14 12-12 16H16z" fill="#f6a6b8" stroke="#a14a60" stroke-width="2" stroke-linejoin="round"/><path d="M19 17 33 29" stroke="#a14a60" stroke-width="2"/></svg>
        <span>Eraser</span>
      </button>
    </div>
    <div class="group">
      <button id="btn-undo" class="btn" title="Undo last cut (Z)">↶ <span>Undo</span></button>
      <button id="btn-hear" class="btn" title="Hear the word (H)">🔊 <span>Hear it</span></button>
      <button id="btn-hint" class="btn" title="Hint (I)">💡 <span>Hint</span></button>
      <button id="btn-check" class="btn primary" title="Check my answer (Enter)">✓ <span>Check</span></button>
      <button id="btn-next" class="btn" title="New word (N)">➜ <span>New word</span></button>
    </div>
  </nav>

  <script type="module" src="js/main.js"></script>
</body>
</html>
